<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peloton LED Pixel Editor</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#1a1e25;--line:#343b47;--ink:#f4f7fb;--muted:#9ba7b8;--accent:#278cff;--pixel:#ff5a36}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0 0 4px}p{margin:0;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(360px,1fr) 330px;gap:18px;padding:18px;max-width:1200px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,select,input,textarea{background:#11151b;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
button{cursor:pointer}button:hover,button.active{border-color:var(--accent);background:#17283d}button.danger:hover{border-color:#ef5665}
label{display:flex;align-items:center;gap:6px;color:var(--muted)}input[type=number]{width:64px}input[type=color]{padding:2px;width:42px;height:34px}
#gridWrap{overflow:auto;display:flex;justify-content:center;align-items:center;min-height:520px;background:#090b0e;border-radius:9px;border:1px solid #292f38}
#grid{touch-action:none;display:block}.row{display:flex;gap:8px}.stack{display:grid;gap:12px}.section h2{font-size:13px;margin:0 0 9px;color:#cbd4df;text-transform:uppercase;letter-spacing:.08em}
#preview{display:block;background:#000;border:1px solid var(--line);image-rendering:pixelated;max-width:100%}textarea{width:100%;height:155px;resize:vertical;font:12px ui-monospace,monospace}
.status{display:flex;justify-content:space-between;color:var(--muted);margin-top:9px}.warning{color:#ffbc51}.ok{color:#67d391}.hint{font-size:12px;line-height:1.45;color:var(--muted)}
@media(max-width:850px){main{grid-template-columns:1fr}#gridWrap{min-height:420px}}
</style>
</head>
<body>
<header><h1>Peloton LED Pixel Editor</h1><p>Click or drag across circles to edit an icon. Everything stays in this one file.</p></header>
<main>
  <section class="panel">
    <div class="toolbar">
      <select id="icons" title="Built-in icon"></select>
      <button id="load">Load icon</button>
      <button data-mode="toggle" class="active">Toggle</button>
      <button data-mode="add">Add</button>
      <button data-mode="erase">Remove</button>
      <button id="undo">Undo</button><button id="redo">Redo</button>
      <button id="clear" class="danger">Clear</button>
    </div>
    <div id="gridWrap"><canvas id="grid"></canvas></div>
    <div class="status"><span id="dimensions"></span><span id="count"></span></div>
  </section>
  <aside class="stack">
    <section class="panel section">
      <h2>Canvas and limit</h2>
      <div class="toolbar"><label>Width <input id="width" type="number" min="1" max="64" value="26"></label><label>Height <input id="height" type="number" min="1" max="64" value="24"></label></div>
      <div class="toolbar"><select id="resizeMode"><option value="scale">Scale artwork to fit</option><option value="crop">Keep top-left / crop</option></select><button id="resize">Resize</button></div>
      <div class="toolbar"><label>Max W <input id="maxWidth" type="number" min="1" max="64" value="26"></label><label>Max H <input id="maxHeight" type="number" min="1" max="64" value="24"></label></div>
      <p id="limit" class="hint"></p>
    </section>
    <section class="panel section">
      <h2>Preview</h2>
      <div class="toolbar"><label>Color <input id="color" type="color" value="#ff5a36"></label><label>Zoom <select id="zoom"><option>1</option><option>2</option><option selected>4</option><option>8</option></select>×</label></div>
      <canvas id="preview"></canvas>
    </section>
    <section class="panel section">
      <h2>Import / export</h2>
      <div class="toolbar"><select id="format"><option value="python">Python mask</option><option value="plain">Plain . and #</option><option value="json">JSON</option></select><button id="export">Export</button><button id="copy">Copy</button><button id="download">Download</button></div>
      <textarea id="text" spellcheck="false" placeholder="Paste a Python mask, JSON rows, or lines made of . and #, then choose Import."></textarea>
      <div class="toolbar"><button id="import">Import pasted pixels</button></div>
      <p class="hint">Tip: export as “Python mask” and send that text back. Right-click always removes pixels. Shift-click always adds them.</p>
    </section>
  </aside>
</main>
<script>
const BUILT_INS = {"cycling":["..........................","..........................","..........................","............###...........","............#.#...........","............###...........","...........#.........##...",".........####.......##....",".........#..##.....##.....","........##...#....##......","........#....###..#.......","........##.......##.......","......#..##...............","......##...#....#.........","........#..#..####........","........##.#..#...#.......",".......##..#.##...#.......","........#..#..#..##.......",".......##..#...###........","......##.........##.......","......#...........#.......","..........................","..........................",".........................."],"bike_bootcamp":["..........................","..........................","..........................","....##.###.##.............","....##.#.#.##..........#..","....#..###..#.........##..","....#...#...#........##...","....#########.......##....",".......###........###.....","........#.........#.......","........#.........#.......","........#..###....##......","........#....#...##.......",".......###...##.###.......",".......###...##.#.####....","......##.##...##..#..##...","......#...#...##..#...#...","......#...#..##...##.##...","......#...#.##.....###....","......#...#...............",".....##...##..............","..........................","..........................",".........................."],"running":["..........................","..........................","..........................",".............###..........",".............#.#..........",".............###.....#....","............##......##....",".........#######...##.....",".........#..##....##......","............#..####.......","............#.#####.......","............##.#..........","..........##.#.##.........",".......####..##.#.........","..............#.##........","..............#..##.......","..............#...#.......","..............#...##......","....##################....","....#................#....","....##################....","..........................","..........................",".........................."],"tread_bootcamp":["..........................","..........................","..........................","...##.###.##..............","...##.#.#.##..............","...#..###..#...........#..","...#...#...#..........##..","...#########.........##...","......###...........##....",".......#.........####.....",".......#.........##.......",".......#..........#.......",".......#..........##......","......###..........#......",".....#####.........##.....",".....##.##..........##....",".....#...##############...",".....#...#............#...",".....#...##############...",".....#...#................","....##...##...............","..........................","..........................",".........................."],"walking":["..........................","..........................","...........##.............","..........#.##............","..........####....##......","...........#......#.......",".........###.....##.......","........####.....###......","........#.##.....##.......","........#.##.######.......","..........##.##...........","...........##.#...........",".........##.#.##..........",".........##.#..#..........",".........#..#..##.........",".........#..##..#.........",".................#........","...#################......","..##...............##.....","..###################.....","....###############.......","..........................","..........................",".........................."],"rowing":["..........................","..........................","..........................","..........................","..........###.............","..........#.#......#......","..........###.....##......",".........##......##.......",".........####...##........","........##..##..#.........","........#......####.......","........#.####.#...#......","........###..###...#......",".........##...##...#......","....###############.......","....##...........##.......","....#.............#.......","..........................","..........................","..........................","..........................","..........................","..........................",".........................."],"row_bootcamp":["..........................","..........................","..........................","..........................","....##.###.##.............","....##.#.#.##......#......","....#..###..#.....##......","....#########....##.......","........#.......##........","........#.......#.........","........#......###........","........#.....#...#.......",".......###....#...#.......","......#########...#.......","......#..#########........","......#..#.......##.......","......#..#........#.......",".....##..##...............","..........................","..........................","..........................","..........................","..........................",".........................."],"strength":["..........................","..........................","..........................","..........................","............###...........","............#.#...........","............###.##........",".............#..##........","............##....#.......","............###..#.##.....","............#.####.##.....","............#.............","............#.............","............#.............","............###...........","...........#######........","...........#.....#........","...........#.....#........","........####.....#........",".....#####.......#........","..........................","..........................","..........................",".........................."],"cardio":["..........................","..........................","..........................",".....###..................",".....#.#..................",".....###..................",".......#######............",".......##.........##......","......####......###.......","......#..########.........","......#...###.............",".......#...#..............","........#..#..............","...........#..............","...........#..............","...........#..............","...........#..............","...........#..............","...........#..............","...........#..............","...........#..............","..........................","..........................",".........................."],"yoga":["..........................","..........................","..........................","..........................",".............###..........",".............#.#..........",".............###..........",".........###########......",".............#............",".............#............",".............#............",".............#............",".............###..........","............#..##.........","...........#....#.........","..........#.....#.........","....##################....","....#...##......##...#....","....#................#....","....##################....","..........................","..........................","..........................",".........................."],"meditation":["..........................","..........................","..........................","..........................","..........................","............##............","...........#..#...........","...........#..#...........","............##............","............##............","...........#####..........","..........#.##.#..........","..........#.##.#..........",".........##.##.##.........","........##..##..##........",".........########.........","......##.########.####....",".....##...##..##.....#....","....##....#....#.....#....","....##################....",".....#################....","..........................","..........................",".........................."],"stretching":["..........................","..........................","..........................","...............###........",".............###..........","............##............","...........##.##..........","..........##.####.........","..........##.####.........",".........##.####..........",".........#...#............","........##...##...........","........##....##..........","........##..####..........","........####..............","........####..............","........#..##.............","........#...#.............","........#...#.............","........#...##............","........#....#............","........#....#............","..........................",".........................."]};
const $=id=>document.getElementById(id), grid=$('grid'), ctx=grid.getContext('2d'), preview=$('preview'), pctx=preview.getContext('2d');
let w=26,h=24,pixels=[],mode='toggle',drag=false,dragValue=true,history=[],future=[];
const clonePixels=()=>pixels.map(r=>r.slice()), snapshot=()=>({w,h,pixels:clonePixels()});
function blank(W,H){return Array.from({length:H},()=>Array(W).fill(false))}
function save(){history.push(snapshot());if(history.length>100)history.shift();future=[]}
function restore(state){w=state.w;h=state.h;pixels=state.pixels.map(r=>r.slice());$('width').value=w;$('height').value=h;render()}
function setRows(rows){h=rows.length;w=Math.max(...rows.map(r=>r.length));pixels=blank(w,h);rows.forEach((r,y)=>[...r].forEach((c,x)=>pixels[y][x]=c==='#'||c==='1'||c===true));$('width').value=w;$('height').value=h;history=[];future=[];render()}
function layout(){const wrap=$('gridWrap'),gap=2;const cell=Math.max(8,Math.min(24,Math.floor(Math.min((wrap.clientWidth-24)/w,(Math.max(360,wrap.clientHeight)-24)/h))));grid.width=w*cell;grid.height=h*cell;grid.dataset.cell=cell}
function render(){layout();const cell=+grid.dataset.cell;ctx.clearRect(0,0,grid.width,grid.height);ctx.fillStyle='#090b0e';ctx.fillRect(0,0,grid.width,grid.height);for(let y=0;y<h;y++)for(let x=0;x<w;x++){ctx.beginPath();ctx.arc(x*cell+cell/2,y*cell+cell/2,Math.max(2,cell*.38),0,Math.PI*2);ctx.fillStyle=pixels[y][x]?$('color').value:'#29303a';ctx.fill();ctx.strokeStyle=pixels[y][x]?'#ffd2c8':'#46505e';ctx.lineWidth=1;ctx.stroke()}renderPreview();$('dimensions').textContent=`${w} × ${h}`;$('count').textContent=`${pixels.flat().filter(Boolean).length} pixels`;const ok=w<=+$('maxWidth').value&&h<=+$('maxHeight').value;$('limit').className='hint '+(ok?'ok':'warning');$('limit').textContent=ok?'Within the configured icon limit.':`Too large: limit is ${$('maxWidth').value} × ${$('maxHeight').value}.`}
function renderPreview(){const z=+$('zoom').value;preview.width=w*z;preview.height=h*z;pctx.fillStyle='#000';pctx.fillRect(0,0,preview.width,preview.height);pctx.fillStyle=$('color').value;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(pixels[y][x])pctx.fillRect(x*z,y*z,z,z)}
function point(e){const r=grid.getBoundingClientRect(),cell=+grid.dataset.cell;return [Math.floor((e.clientX-r.left)*grid.width/r.width/cell),Math.floor((e.clientY-r.top)*grid.height/r.height/cell)]}
function paint(e,first=false){const [x,y]=point(e);if(x<0||x>=w||y<0||y>=h)return;if(first){save();dragValue=e.button===2?false:e.shiftKey?true:mode==='add'?true:mode==='erase'?false:!pixels[y][x]}pixels[y][x]=dragValue;render()}
grid.addEventListener('contextmenu',e=>e.preventDefault());grid.addEventListener('pointerdown',e=>{drag=true;grid.setPointerCapture(e.pointerId);paint(e,true)});grid.addEventListener('pointermove',e=>{if(drag)paint(e)});grid.addEventListener('pointerup',()=>drag=false);grid.addEventListener('pointercancel',()=>drag=false);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
function loadIcon(){const rows=BUILT_INS[$('icons').value];setRows(rows)}
$('load').onclick=loadIcon;$('clear').onclick=()=>{save();pixels=blank(w,h);render()};
$('undo').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop())}};
$('resize').onclick=()=>{const nw=+$('width').value,nh=+$('height').value;if(!nw||!nh)return;save();const old=clonePixels(),ow=w,oh=h,next=blank(nw,nh);for(let y=0;y<nh;y++)for(let x=0;x<nw;x++){const sx=$('resizeMode').value==='scale'?Math.min(ow-1,Math.floor(x*ow/nw)):x,sy=$('resizeMode').value==='scale'?Math.min(oh-1,Math.floor(y*oh/nh)):y;if(sx<ow&&sy<oh)next[y][x]=old[sy][sx]}w=nw;h=nh;pixels=next;render()};
function rows(){return pixels.map(r=>r.map(v=>v?'#':'.').join(''))}
function exported(){const r=rows(),f=$('format').value;if(f==='plain')return r.join('\n');if(f==='json')return JSON.stringify({width:w,height:h,rows:r},null,2);return "(\n"+r.map(x=>"    '"+x+"',").join('\n')+"\n)"}
$('export').onclick=()=>$('text').value=exported();$('copy').onclick=async()=>{if(!$('text').value)$('text').value=exported();await navigator.clipboard.writeText($('text').value)};
$('download').onclick=()=>{const blob=new Blob([exported()],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('icons').value||'pixel-art')+'.txt';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>{let t=$('text').value.trim(),r=[];try{const j=JSON.parse(t);r=Array.isArray(j)?j:j.rows||[]}catch{r=t.split(/\r?\n/).map(x=>(x.match(/[.#01]+/)||[])[0]).filter(Boolean)}if(r.length)setRows(r);else alert('No pixel rows found. Use . and #, a Python tuple, or JSON rows.')};
['zoom','color','maxWidth','maxHeight'].forEach(id=>$(id).oninput=render);window.onresize=render;
Object.keys(BUILT_INS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());$('icons').append(o)});loadIcon();
</script>
</body>
</html>
